# devd(8) rule: tell every running dak to look for keypads when one is plugged in
# (or comes back after a suspend), so a dak that gave up on a keypad, or started
# without one, picks it up without being restarted.
#
# Not active by default. To use it (as root):
#   cp dak-rescan.conf /usr/local/etc/devd/
#   service devd restart
#
# Vendor 0x0300, product 0x3002 is the Ajazz AKP03E/AKP03R; add a block per other
# keypad model you use. pkill signals the dak of every user, which is harmless: a
# dak with nothing to look for ignores the rescan.
attach 100 {
	match "vendor" "0x0300";
	match "product" "0x3002";
	action "/bin/pkill -USR1 -x dak";
};
