[package]
name = "dak"
version = "0.13.0"
edition = "2021"
authors = ["TheHolm <theholm@github.com>"]
description = "Controls an Ajazz AKP03E/AKP03R USB macro keypad: paints button images, sets brightness, and reacts to key/encoder input"
# `license` and `license-file` are mutually exclusive in Cargo.toml; AGPL-3.0-or-later
# has a valid SPDX identifier so that's used here rather than license-file. This is
# only the program's own licence: the embedded fonts keep theirs, and every licence's
# full text is in debian/copyright (see the deb assets below).
license = "AGPL-3.0-or-later"
repository = "https://github.com/theholm/dak"

# `$auto` keeps cargo-deb's implicit assets (the `dak` binary) and the two man
# pages are added on top of it, at the paths Debian's man(7) expects. cargo-deb
# compresses anything under usr/share/man/ itself, per Debian policy.
#
# debian/copyright is installed explicitly as the package's one licence file (Debian
# Policy 12.5, which Ubuntu follows too): with an asset at that path cargo-deb does not
# generate its own, which only named the licence ("License: AGPL-3.0-or-later")
# without its text - not enough, since AGPL, the fonts' Bitstream Vera/Arev terms and
# OFL-1.1 are all absent from /usr/share/common-licenses and so must be quoted in full.
[package.metadata.deb]
# Debian archive section; without it lintian warns "recommended-field Section".
section = "utils"
assets = [
    "$auto",
    { source = "man/dak.1", dest = "usr/share/man/man1/dak.1", mode = "644" },
    { source = "man/dak-config.5", dest = "usr/share/man/man5/dak-config.5", mode = "644" },
    { source = "debian/copyright", dest = "usr/share/doc/dak/copyright", mode = "644" },
]

[dependencies]
chrono = { version = "0.4" }
image = { version = "0.25" }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "signal", "fs"] }

serde_json = { version = "1.0.150"}
serde = { version = "1", features = ["derive"] }
ab_glyph = "0.2"
# Grapheme clusters and display widths, so button text is cut to 6 columns without
# splitting a character (emoji count as two columns).
unicode-segmentation = "1"
unicode-width = "0.2"
clap = { version = "4", features = ["derive"] }

# Only used by tests/man_pages.rs to render man/dak.1 from the clap definition in
# src/cli.rs, so the committed man page cannot drift from the real flags. Dev-only:
# the shipped binary does not link it. Deliberately not version-pinned - the test
# compares the generated and committed pages semantically (normalized tokens), not
# byte-for-byte, so a newer clap_mangen/roff that only changes escaping or wrapping
# does not spuriously fail. Regenerate with the ignored test in tests/man_pages.rs.
[dev-dependencies]
clap_mangen = "0.3"

# HID device access. Every platform but FreeBSD uses the real, unmodified crates.io
# releases. FreeBSD gets a local fork (vendor/) that adds a `hidraw(4)`-based backend
# to async-hid, which has no FreeBSD support upstream (see AGENTS.md); mirajazz itself
# is vendored byte-for-byte unmodified, just pointed at the local async-hid fork,
# since mirajazz has no platform-specific code of its own beyond what it already gets
# from async-hid.
#
# Cargo requires a single dependency *name* to resolve to one source kind (registry vs
# path) across all targets, so the two platform cases use different manifest keys
# (`mirajazz` vs `mirajazz-freebsd`); `package =` tells Cargo which crate each key
# actually refers to, but the *local* Rust name still follows the key, not `package =`
# - so a small `extern crate mirajazz_freebsd as mirajazz;` bridge (src/lib.rs,
# src/main.rs, FreeBSD-only) re-exposes both under the plain names
# (`mirajazz`/`async_hid`) the rest of the crate uses unconditionally. See
# vendor/README.md for the full picture.
[target.'cfg(not(target_os = "freebsd"))'.dependencies]
mirajazz = { version = "0.16" }
async-hid = { version = "0.5.3", default-features = false, features = ["tokio"] }

[target.'cfg(target_os = "freebsd")'.dependencies]
mirajazz-freebsd = { path = "vendor/mirajazz-freebsd", package = "mirajazz" }
async-hid-freebsd = { path = "vendor/async-hid-freebsd", package = "async-hid", default-features = false, features = ["tokio"] }
