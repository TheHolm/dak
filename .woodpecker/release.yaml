# Builds and publishes release artifacts to a GitHub Release. Only ever runs
# on tag pushes matching v* (this repo's tag convention - see AGENTS.md's
# release process and `git tag -l`). Never runs on ordinary branch pushes or
# pull requests.
#
# Every step below uses a plain, official base image and installs whatever
# it needs inline (apt-get/cargo install/rustup/FreeBSD sysroot download).
#
# An earlier version of this pipeline used prebuilt custom images (built by
# a since-removed .woodpecker/build-ci-images.yaml) to avoid redoing those
# installs on every release. That required bind-mounting the Woodpecker
# agent's Docker socket, which Woodpecker only allows for repos marked
# "Trusted" (an admin-only setting) - since that's not available here,
# every step below just does its own installs inline instead, and every
# tagged release re-downloads its own toolchain. Tags are rare (real
# releases only), so this is an acceptable trade-off. Revisit with a proper
# build cache (e.g. a plugin-cache backed by S3/Minio, which needs no
# Trusted flag since it works over plain HTTP rather than mounting host
# paths) if release build times become a real problem.
#
# Requirements for this to work:
#   - A `github_token` secret is set on this repo in Woodpecker (Project
#     Settings -> Secrets), holding a GitHub PAT scoped to Contents:
#     read/write on theholm/dak, restricted to the "tag" event.
#   - Gitea's push mirror to github.com/theholm/dak is set up and syncs
#     tags promptly, so the tag this workflow is releasing already exists
#     on GitHub (or `gh release create` will create it pointing at the
#     default branch instead of this exact commit).

when:
  - event: tag
    ref: refs/tags/v*

steps:
  # Reuses the same image as the deb-trixie step below (already needed there)
  # instead of a separate alpine/git pull - it's Debian-based (via
  # buildpack-deps:trixie-scm), so bash and git are already present, no
  # apk/apt-get install needed for just a `git archive`.
  - name: src-tarball
    image: rust:1.92-trixie
    commands:
      - VERSION="${CI_COMMIT_TAG#v}"
      - mkdir -p dist
      - ./scripts/make-src-tarball.sh "$VERSION" dist

  - name: deb-trixie
    image: rust:1.92-trixie
    environment:
      CARGO_TARGET_DIR: target/deb-trixie
    commands:
      - apt-get update && apt-get install -y --no-install-recommends libudev-dev
      - cargo install cargo-deb --locked
      - mkdir -p dist
      - cargo deb
      - cp target/deb-trixie/debian/*.deb dist/

  - name: deb-ubuntu2604
    image: ubuntu:26.04
    environment:
      CARGO_TARGET_DIR: target/deb-ubuntu2604
    commands:
      - apt-get update && apt-get install -y --no-install-recommends curl ca-certificates build-essential libudev-dev pkg-config
      - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.92.0
      - . "$HOME/.cargo/env"
      - cargo install cargo-deb --locked
      - mkdir -p dist
      - cargo deb
      - cp target/deb-ubuntu2604/debian/*.deb dist/

  - name: freebsd-pkg
    image: rust:1.92-trixie
    environment:
      CARGO_TARGET_DIR: target/freebsd
      CARGO_TARGET_X86_64_UNKNOWN_FREEBSD_LINKER: clang
      RUSTFLAGS: "-C link-arg=--target=x86_64-unknown-freebsd15 -C link-arg=--sysroot=/opt/freebsd-sysroot -C link-arg=-fuse-ld=lld -C link-arg=-B/opt/freebsd-sysroot/usr/lib"
    commands:
      - VERSION="${CI_COMMIT_TAG#v}"
      - rustup target add x86_64-unknown-freebsd
      - apt-get update && apt-get install -y --no-install-recommends clang lld zstd python3
      - mkdir -p /opt/freebsd-sysroot
      # Verified against real FreeBSD 15.0-RELEASE and 15.1-RELEASE base.txz
      # files (downloaded and inspected with `tar -tvJf`): every member
      # needs the leading `./` - GNU tar does NOT normalize that away when
      # extracting explicitly named members, contrary to what NOTES.md
      # section 1.4 assumed - and `libutil.so.9` was bumped to
      # `libutil.so.10` in FreeBSD 15 (soname bump, everything else
      # unchanged from the 14.5 list; confirmed identical between 15.0 and
      # 15.1, as expected within the same major ABI version). If a future
      # FreeBSD release moves other sonames, re-run
      # `tar -tvJf base.txz | grep <libname>` against that release's
      # base.txz to find the new name, then update this list, this comment,
      # and NOTES.md section 1.4a. scripts/check-target-freshness.sh flags
      # in CI when a newer FreeBSD release than the one pinned below exists.
      - curl -fsSL -o /tmp/base.txz https://download.freebsd.org/releases/amd64/amd64/15.1-RELEASE/base.txz
      - >-
        tar -xJf /tmp/base.txz -C /opt/freebsd-sysroot
        ./lib/libc.so.7 ./usr/lib/libc.so ./usr/lib/libc_nonshared.a
        ./lib/libm.so.5 ./usr/lib/libm.so
        ./lib/libutil.so.10 ./usr/lib/libutil.so
        ./lib/librt.so.1 ./usr/lib/librt.so
        ./usr/lib/libexecinfo.so.1 ./usr/lib/libexecinfo.so
        ./lib/libkvm.so.7 ./usr/lib/libkvm.so
        ./usr/lib/libmemstat.so.3 ./usr/lib/libmemstat.so
        ./usr/lib/libprocstat.so.1 ./usr/lib/libprocstat.so
        ./lib/libdevstat.so.7 ./usr/lib/libdevstat.so
        ./lib/libthr.so.3 ./usr/lib/libthr.so ./usr/lib/libpthread.so
        ./lib/libgcc_s.so.1 ./usr/lib/libgcc_s.so
        ./usr/lib/crt1.o ./usr/lib/Scrt1.o ./usr/lib/crti.o ./usr/lib/crtn.o
        ./usr/lib/crtbegin.o ./usr/lib/crtbeginS.o ./usr/lib/crtbeginT.o
        ./usr/lib/crtend.o ./usr/lib/crtendS.o
      - rm -f /tmp/base.txz
      - cargo build --release --target x86_64-unknown-freebsd
      - mkdir -p dist stage-root/usr/local/bin stage-root/usr/local/share/doc/dak
      - cp target/freebsd/x86_64-unknown-freebsd/release/dak stage-root/usr/local/bin/dak
      - chmod 555 stage-root/usr/local/bin/dak
      - cp README.markdown LICENSE stage-root/usr/local/share/doc/dak/
      - chmod 644 stage-root/usr/local/share/doc/dak/README.markdown stage-root/usr/local/share/doc/dak/LICENSE
      - >-
        python3 scripts/build-freebsd-pkg.py
        --version "$VERSION"
        --stage-root stage-root
        --output "dist/dak-${VERSION}-freebsd-amd64.pkg"

  - name: publish-github-release
    image: debian:trixie-slim
    environment:
      GH_TOKEN:
        from_secret: github_token
    commands:
      - apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gnupg
      - mkdir -p -m 755 /etc/apt/keyrings
      - curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg -o /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg
      - echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" > /etc/apt/sources.list.d/github-cli.list
      - apt-get update && apt-get install -y --no-install-recommends gh
      - ./scripts/extract-release-notes.sh "$CI_COMMIT_TAG" RELEASE_NOTES.md > /tmp/release-notes.md
      - >-
        gh release create "$CI_COMMIT_TAG" dist/*
        --repo theholm/dak
        --title "$CI_COMMIT_TAG"
        --notes-file /tmp/release-notes.md
